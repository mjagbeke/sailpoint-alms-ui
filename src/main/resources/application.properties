# Localhost only: the UI runs operations with the credentials files on this machine
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off

# Tenants' credentials files (<tenant>.yaml, SOPS-encrypted), as for the command line; create one with
#   java -jar sailpoint-alms-<version>-jar-with-dependencies.jar --set-credential <tenant>
alms.credentials-dir=${user.home}/.sailpoint-alms/credentials
# The folder the UI reads drivers and sheets from, and that its file browser shows. Runs write their OUTPUT files next
# to their sheets, as on the command line. Narrow it to your work folder, e.g. --alms.work-dir=C:/work
alms.work-dir=${user.home}

logging.level.com.secureitsource=INFO
logging.level.io=INFO
