# Localhost only: the UI runs operations with the credentials files on this machine
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# Credentials files (SOPS YAML, one per tenant) the UI offers; create them with
#   java -cp sailpoint-alms.jar io.isc.runner.mainClass --set-credential <file>
alms.credentials-dir=${user.home}/.sailpoint-alms/credentials
# Where uploaded sheets are kept while they run, and their OUTPUT files until the next upload
alms.workspace-dir=${java.io.tmpdir}/sailpoint-alms-ui

logging.level.com.secureitsource=INFO
logging.level.io=INFO
